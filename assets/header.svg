<svg width="900" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Roger - Software Developer, 42 Barcelona">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#16213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#a371f7;#3fb950;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#3fb950;#58a6ff;#a371f7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    .fade { opacity: 0; animation: show 0.7s ease forwards; }
    @keyframes show { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3s; opacity: 0; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <rect width="900" height="290" rx="16" fill="url(#bg)"/>
  <rect width="900" height="290" rx="16" fill="url(#grid)"/>

  <rect x="20" y="20" width="860" height="250" rx="12" fill="#0d1117" fill-opacity="0.85" stroke="url(#accent)" stroke-width="1.5"/>

  <circle cx="46" cy="40" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="40" r="6" fill="#ffbd2e"/>
  <circle cx="90" cy="40" r="6" fill="#27c93f"/>
  <text x="450" y="45" font-size="13" fill="#8b949e" text-anchor="middle">roger@42barcelona: ~</text>
  <line x1="20" y1="60" x2="880" y2="60" stroke="#30363d" stroke-width="1"/>

  <g class="fade" style="animation-delay: 0.3s">
    <text x="44" y="96" font-size="18" fill="#3fb950">$</text>
    <text x="64" y="96" font-size="18" fill="#c9d1d9">whoami</text>
  </g>

  <text class="fade" style="animation-delay: 1s" x="44" y="156" font-size="56" font-weight="700" fill="url(#accent)">Roger</text>

  <text class="fade" style="animation-delay: 1.6s" x="44" y="192" font-size="20" fill="#e6edf3">Software Developer  ·  42 Barcelona</text>

  <text class="fade" style="animation-delay: 2.2s" x="44" y="220" font-size="15" fill="#8b949e">C  •  Python  •  Systems  •  Algorithms  •  Concurrency</text>

  <g class="fade" style="animation-delay: 2.8s">
    <text x="44" y="252" font-size="18" fill="#3fb950">$</text>
  </g>
  <rect class="cursor" x="64" y="237" width="10" height="18" fill="#58a6ff"/>
</svg>
